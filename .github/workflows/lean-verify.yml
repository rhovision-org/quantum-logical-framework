name: Lean 4 Formal Verification

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lean/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/axiom_audit.sh'
      - 'scripts/proof_trust.py'
      - 'tests/test_proof_trust.py'
      - '.github/workflows/lean-verify.yml'

  pull_request:
    # Verify the clock-domain implementation while it is stacked on #235.
    branches: [ "main", "research/gupta-clock-conventions" ]
    paths:
      - 'lean/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/axiom_audit.sh'
      - 'scripts/proof_trust.py'
      - 'tests/test_proof_trust.py'
      - '.github/workflows/lean-verify.yml'

# A newer commit supersedes the previous verification of the same PR.
concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cheap and independent of Lean: catches an assumption added to lean/ before
      # spending six minutes building. See scripts/axiom_audit.sh.
      - name: Audit declared axioms
        run: ./scripts/axiom_audit.sh

      - name: Reject proof placeholders and test the trust gate
        run: |
          python3 scripts/proof_trust.py --scan-only
          python3 -m unittest discover -s tests -p 'test_proof_trust.py' -v

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Clean Lake cache (prevents "unknown module prefix" errors)
        run: |
          pkill lean || true
          rm -rf .lake
          lake clean

      # Deliberately NOT `lake update`. The dependency set is pinned in lakefile.lean and
      # recorded in lake-manifest.json, so the build resolves to stated revisions and a green
      # run reproduces. `lake update` re-resolved Mathlib to master on every push, which meant
      # the verification claim was against whatever master happened to be that morning.
      # To advance Mathlib, update the pin and manifest in a commit of their own.
      - name: Fetch Mathlib cache
        run: lake exe cache get

      # Recreate dependency metadata first; never restore .lake/packages or a
      # stale Lake configuration. Cache only QLF outputs and their Lake traces.
      - name: Restore compatible QLF build
        id: qlf-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-qlf-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('lean/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-qlf-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-

      # Bootstrap the first cache from an already VERIFIED same-branch run only
      # when every Lean/build input is byte-identical. This also avoids a cold
      # rebuild if the cache was evicted but the 7-day artifact is still present.
      - name: Seed missing cache from identical verified sources
        if: steps.qlf-cache.outputs.cache-matched-key == '' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          candidate=$(gh run list --workflow lean-verify.yml --branch "$CI_HEAD_BRANCH" --status success --limit 1 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          if [[ -z "$candidate" ]]; then
            echo "No verified artifact available; use a cold build."
            exit 0
          fi
          read -r prior_run prior_sha <<< "$candidate"
          git fetch --no-tags --depth=1 origin "$prior_sha"
          if ! git diff --quiet "$prior_sha" HEAD -- lean/ lakefile.lean lean-toolchain lake-manifest.json; then
            echo "Lean/build inputs changed; artifact reuse refused."
            exit 0
          fi
          seed_dir=$(mktemp -d)
          trap 'rm -rf "$seed_dir"' EXIT
          gh run download "$prior_run" --name qlf-olean-build --dir "$seed_dir"
          mkdir -p .lake/build
          cp -a "$seed_dir"/. .lake/build/
          echo "Reused verified QLF artifact from run $prior_run with identical Lean/build inputs."

      # Always let Lake validate traces and rebuild the affected dependency
      # closure. A cache hit never skips source validation or the axiom gate.
      - name: Build Lean targets incrementally (cold build on cache miss)
        run: |
          lake build

      # Uploaded so a local build (e.g. on constrained hardware) can download the
      # compiled QLF modules instead of recompiling from source. Mathlib's own oleans
      # are excluded (they're separately cacheable via `lake exe cache get`), keeping
      # this artifact to just this repo's own ~215 modules.
      - name: Upload compiled QLF modules
        uses: actions/upload-artifact@v4
        with:
          name: qlf-olean-build
          path: |
            .lake/build/lib/lean
            .lake/build/ir
          retention-days: 7

      # The dependency footprint of the anchor theorems: which axioms the kernel
      # actually used, printed by lean/QLF_AxiomAudit.lean. Re-elaborated on its own so
      # the report is one contiguous block in the log rather than scattered through the
      # build. See that file for how to read it.
      - name: Verify exact anchor axiom footprints
        run: |
          set -euo pipefail
          lake env lean lean/QLF_AxiomAudit.lean | tee /tmp/qlf_axiom_footprints.log
          python3 scripts/proof_trust.py --log /tmp/qlf_axiom_footprints.log

      # Save only after both compilation AND the exact-footprint gate pass.
      - name: Save verified QLF build
        if: success() && steps.qlf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.qlf-cache.outputs.cache-primary-key }}
