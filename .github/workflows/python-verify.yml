name: Python source checks

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "claim_records/**"
      - ".github/workflows/python-verify.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "claim_records/**"
      - ".github/workflows/python-verify.yml"

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile every tracked Python source
        run: |
          git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile

      - name: Validate every typed claim record
        run: python3 scripts/validate_claim_records.py

      - name: Run dependency-free regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
